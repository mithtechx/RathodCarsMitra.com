name: rcm_user_app
description: "Rathod Cars Mitra - Multi-platform cab booking and fleet management app."
publish_to: 'none'

version: 1.0.2+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Supabase Backend & Auth
  supabase_flutter: ^2.5.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Driver Verification Image & File Selection
  image_picker: ^1.1.2

  # Payment QR & Utilities
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # PDF Generation & Printing
  pdf: ^3.10.7
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Future asset declarations
  # assets:
  #   - assets/images/